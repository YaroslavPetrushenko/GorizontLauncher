name: Build launcher

on:
  workflow_dispatch:
  push:
    tags: ['launcher-v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci --no-audit --no-fund
      - name: Require the game server key
        shell: bash
        env:
          GORIZONT_HMAC_SECRET: ${{ secrets.GORIZONT_HMAC_SECRET }}
        run: |
          if [ -z "$GORIZONT_HMAC_SECRET" ]; then
            echo "::error::The GitHub secret GORIZONT_HMAC_SECRET is not set. A launcher built without it cannot talk to the game server, so the release is not built."
            exit 1
          fi
      - run: npm run tauri build
        env:
          # Baked into the launcher with option_env!; never committed to the repository.
          GORIZONT_HMAC_SECRET: ${{ secrets.GORIZONT_HMAC_SECRET }}
      - name: Publish Windows installer
        uses: softprops/action-gh-release@v2
        with:
          name: Gorizont Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
