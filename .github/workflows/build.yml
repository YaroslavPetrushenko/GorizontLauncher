name: Build launcher

on:
  workflow_dispatch:
  push:
    tags: ['launcher-v*']

permissions:
  contents: write

jobs:
  # The release is created once as a draft, before the system builds start, so they do not race to create it.
  # A published release is immutable, so it is published only after every installer is attached.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: |
            ## Какой файл скачать
            - **Windows** — `Gorizont-Launcher_Windows_…-setup.exe` (или `.msi`)
            - **macOS, чип Apple (M1, M2, M3, M4)** — `Gorizont-Launcher_macOS-Apple-Silicon_….dmg`
            - **macOS, процессор Intel** — `Gorizont-Launcher_macOS-Intel_….dmg`
            - **Linux** — `Gorizont-Launcher_Linux_….AppImage` (или `.deb` для Debian и Ubuntu)
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Gorizont Launcher $TAG" --generate-notes --draft --notes "$NOTES"

  build:
    needs: release
    # A manual run on a branch only checks that everything builds: nothing is published.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macOS (Apple silicon)
            label: macOS-Apple-Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles dmg'
            files: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS (Intel)
            label: macOS-Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles dmg'
            files: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            label: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: '--bundles appimage,deb'
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --no-audit --no-fund
      - name: Require the game server key
        shell: bash
        env:
          GORIZONT_HMAC_SECRET: ${{ secrets.GORIZONT_HMAC_SECRET }}
        run: |
          if [ -z "$GORIZONT_HMAC_SECRET" ]; then
            echo "::error::The GitHub secret GORIZONT_HMAC_SECRET is not set. A launcher built without it cannot talk to the game server, so the release is not built."
            exit 1
          fi
      - name: Build
        shell: bash
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          # Baked into the launcher with option_env!; never committed to the repository.
          GORIZONT_HMAC_SECRET: ${{ secrets.GORIZONT_HMAC_SECRET }}
      - name: Put the system into the file names
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          FILES: ${{ matrix.files }}
        run: |
          # "Gorizont Launcher_1.4.1_x64-setup.exe" -> "Gorizont-Launcher_Windows_1.4.1_x64-setup.exe"
          for pattern in $FILES; do
            for f in $pattern; do
              dir=$(dirname "$f"); base=$(basename "$f")
              mv "$f" "$dir/Gorizont-Launcher_${LABEL}_${base#*_}"
            done
          done
      - name: Publish installers
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Gorizont Launcher ${{ github.ref_name }}
          draft: true
          files: ${{ matrix.files }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
